apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeanos-backend
  namespace: jeanos-shop
  labels:
    app: jeanos-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jeanos-backend
  template:
    metadata:
      labels:
        app: jeanos-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              echo "Esperando PostgreSQL..."
              until pg_isready -h postgres-service -p 5432 -U "$DB_USER" -d "$DB_NAME"; do
                echo "PostgreSQL aún no está listo..."
                sleep 2
              done

              echo "PostgreSQL listo. Validando catálogo mínimo en PostgreSQL..."
              until psql -h postgres-service -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -tAc "
                SELECT
                  (SELECT COUNT(*) FROM clases_producto) AS clases,
                  (SELECT COUNT(*) FROM productos) AS productos,
                  (SELECT COUNT(*) FROM spec_definitions) AS spec_defs,
                  (SELECT COUNT(*) FROM producto_specs) AS producto_specs;
              " 2>/dev/null | awk -F'|' '
                NF == 4 && $1 > 0 && $2 > 0 && $3 > 0 && $4 > 0 { ok=1 }
                END { exit(ok ? 0 : 1) }
              '; do
                echo "Catálogo incompleto (clases_producto, productos, spec_definitions o producto_specs vacíos o tablas aún no creadas). Reintentando..."
                sleep 2
              done

              echo "Catálogo validado:"
              psql -h postgres-service -U "$DB_USER" -d "$DB_NAME" -c "
                SELECT 'clases_producto' AS tabla, COUNT(*)::text AS filas FROM clases_producto
                UNION ALL SELECT 'productos', COUNT(*)::text FROM productos
                UNION ALL SELECT 'spec_definitions', COUNT(*)::text FROM spec_definitions
                UNION ALL SELECT 'producto_specs', COUNT(*)::text FROM producto_specs;
              "
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              echo "Esperando Redis..."
              until redis-cli -h redis-service -p 6379 ping | grep PONG; do
                echo "Redis aún no está listo..."
                sleep 2
              done
              echo "Redis listo."

        - name: preload-redis
          image: docker.io/aliothosa/jeanos-backend:v1
          imagePullPolicy: Always
          command: ["node", "scripts/preload-redis.js"]
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: CACHE_TTL_SECONDS
              value: "3600"

      containers:
        - name: backend
          image: docker.io/aliothosa/jeanos-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          env:
            - name: PORT
              value: "3000"

            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"

            - name: CACHE_TTL_SECONDS
              value: "3600"

          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
