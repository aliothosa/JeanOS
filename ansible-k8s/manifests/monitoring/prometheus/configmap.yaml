# Actualizar IPs de node-exporter si tu lab difiere: kubectl get nodes -o wide
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      # Etiqueta de cluster: dashboards de comunidad (ej. 15760) la usan como
      # variable de plantilla y, sin ella, filtran todas las series y salen vacíos.
      external_labels:
        cluster: jeanos

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: node-exporter
        static_configs:
          - targets:
              - '192.168.41.154:9100'   # k8s-master01
              - '192.168.41.157:9100'   # k8s-worker01
              - '192.168.41.158:9100'   # k8s-worker02
            labels:
              cluster: jeanos

      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc:8080']
            labels:
              cluster: jeanos

      - job_name: jeanos-backend
        metrics_path: /metrics
        static_configs:
          - targets: ['jeanos-backend-service.jeanos-shop.svc:3000']
            labels:
              namespace: jeanos-shop
              app: jeanos-backend

      - job_name: tempo
        metrics_path: /metrics
        static_configs:
          - targets: ['tempo.monitoring.svc:3200']
            labels:
              namespace: monitoring
              app: tempo

      - job_name: kubernetes-pods-annotated
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: cluster
            replacement: jeanos

      # cAdvisor (kubelet) vía proxy del API Server: métricas container_* por pod.
      # Necesario para dashboards tipo "Kubernetes / Views / Pods" (ID 15760).
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - target_label: cluster
            replacement: jeanos
