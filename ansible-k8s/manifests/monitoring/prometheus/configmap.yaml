# Actualizar IPs de node-exporter si tu lab difiere: kubectl get nodes -o wide
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      # Etiqueta de cluster: dashboards de comunidad (ej. 15760) la usan como
      # variable de plantilla y, sin ella, filtran todas las series y salen vacíos.
      external_labels:
        cluster: jeanos

    # Reglas de alerta (mismo ConfigMap, montado en /etc/prometheus).
    rule_files:
      - /etc/prometheus/alert.rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager.monitoring.svc:9093']

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: alertmanager
        static_configs:
          - targets: ['alertmanager.monitoring.svc:9093']
            labels:
              cluster: jeanos

      - job_name: node-exporter
        static_configs:
          - targets:
              - '192.168.41.154:9100'   # k8s-master01
              - '192.168.41.157:9100'   # k8s-worker01
              - '192.168.41.158:9100'   # k8s-worker02
            labels:
              cluster: jeanos

      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc:8080']
            labels:
              cluster: jeanos

      - job_name: jeanos-backend
        metrics_path: /metrics
        static_configs:
          - targets: ['jeanos-backend-service.jeanos-shop.svc:3000']
            labels:
              namespace: jeanos-shop
              app: jeanos-backend

      - job_name: tempo
        metrics_path: /metrics
        static_configs:
          - targets: ['tempo.monitoring.svc:3200']
            labels:
              namespace: monitoring
              app: tempo

      - job_name: kubernetes-pods-annotated
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: cluster
            replacement: jeanos

      # cAdvisor (kubelet) vía proxy del API Server: métricas container_* por pod.
      # Necesario para dashboards tipo "Kubernetes / Views / Pods" (ID 15760).
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - target_label: cluster
            replacement: jeanos

  alert.rules.yml: |
    groups:
      - name: jeanos-backend
        rules:
          - alert: BackendDown
            expr: up{job="jeanos-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Backend JeanOS caído"
              description: "El target {{ $labels.job }} lleva >1m sin responder al scrape."

          - alert: BackendHighErrorRate
            expr: |
              sum(rate(jeanos_http_requests_total{status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(jeanos_http_requests_total[5m])), 0.001) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Tasa de errores 5xx alta (>5%)"
              description: "El backend supera el 5% de respuestas 5xx durante 5m."

          - alert: BackendHighLatencyP95
            expr: |
              histogram_quantile(0.95,
                sum(rate(jeanos_http_request_duration_seconds_bucket[5m])) by (le)) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Latencia HTTP p95 alta (>1s)"
              description: "La latencia p95 del backend supera 1s durante 5m."

      - name: jeanos-kubernetes
        rules:
          - alert: PodNotReady
            expr: |
              sum by (namespace) (
                kube_pod_status_phase{namespace="jeanos-shop", phase=~"Pending|Unknown|Failed"}
              ) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pods no listos en {{ $labels.namespace }}"
              description: "Hay pods en estado Pending/Unknown/Failed durante 5m."

          - alert: PodHighMemoryUsage
            expr: |
              sum by (pod) (container_memory_working_set_bytes{namespace="jeanos-shop", container!="", container!="POD"})
              /
              clamp_min(sum by (pod) (kube_pod_container_resource_limits{namespace="jeanos-shop", resource="memory"}), 1) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Memoria del pod cerca del límite (>90%)"
              description: "El pod {{ $labels.pod }} usa más del 90% de su límite de memoria durante 5m."

      - name: jeanos-infra
        rules:
          - alert: NodeHighCpu
            expr: |
              100 - (avg by (instance) (rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])) * 100) > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "CPU del nodo alta (>85%)"
              description: "El nodo {{ $labels.instance }} supera el 85% de CPU durante 5m."

          - alert: TargetDown
            expr: up == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Target de scrape caído"
              description: "El target {{ $labels.job }} ({{ $labels.instance }}) lleva >2m caído."
